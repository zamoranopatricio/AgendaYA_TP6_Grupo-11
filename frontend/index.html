<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaYA - Reserva de Turno</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>
    <div class="container">
        <h1>AgendaYA - Reserva de Turno</h1>

        <!-- Resumen persistente (M04-R04NF) -->
        <div data-cy="booking-summary" class="summary-box">
            <h3>Resumen del Turno</h3>
            <p>Servicio: <span id="summary-service">Consulta Inicial</span></p>
            <p>Fecha y Hora: <span id="summary-datetime">Seleccione un horario</span></p>
        </div>

        <!-- Formulario de Booking (M04) -->
        <form id="booking-form">
            <label for="service-select">Tipo de Evento:</label>
            <select data-cy="service-select" id="service-select">
                <option value="Consulta Inicial">Consulta Inicial (30 min)</option>
                <option value="Seguimiento">Seguimiento (15 min)</option>
            </select>

            <label for="timeslot-select">Fecha y Horario disponible:</label>
            <select data-cy="timeslot-select" id="timeslot-select">
                <option value="">-- Elija un turno --</option>
                <option value="2026-10-15 10:00">15/10/2026 - 10:00 hs</option>
                <option value="2026-10-15 11:00">15/10/2026 - 11:00 hs</option>
            </select>

            <label for="name">Nombre Completo:</label>
            <input data-cy="name-input" type="text" id="name" placeholder="Ej: Juan Pérez">

            <label for="email">Correo Electrónico:</label>
            <input data-cy="email-input" type="email" id="email" placeholder="invitado@test.com">

            <button data-cy="submit-booking" type="submit">Confirmar Reserva</button>
        </form>

        <!-- Mensajes de feedback -->
        <div data-cy="error-message" class="error" style="display: none;"></div>

        <div data-cy="booking-confirmation" class="pending-box" style="display: none;">
            <h2 id="confirmation-title">¡Reserva Pendiente de Confirmación!</h2>
            <p id="confirmation-details"></p>
        </div>

        <!-- Simulación M06: Bandeja de Notificaciones generadas -->
        <hr>
        <h3>Bandeja de Notificaciones (Simulación M06)</h3>
        <div data-cy="notifications-log" id="notifications-log">
            <em>No hay notificaciones enviadas aún.</em>
        </div>
    </div>

    <script src="/frontend/app.js"></script>
</body>

</html>
