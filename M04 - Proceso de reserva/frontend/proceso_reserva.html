<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaYA - Reserva de Turno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AgendaYA - Reserva de Turno</h1>

        <section id="step-event">
            <label for="service-select">Tipo de Evento:</label>
            <select data-cy="service-select" id="service-select">
                <option value="">-- Elija un evento --</option>
                <option value="Consulta">Consulta</option>
                <option value="Consulta Inicial">Consulta Inicial (30 min)</option>
                <option value="Seguimiento">Seguimiento (15 min)</option>
            </select>
            <button data-cy="continue-to-date" type="button" hidden>Continuar a fecha</button>
        </section>

        <section id="step-date" hidden>
            <label for="date-select">Fecha disponible:</label>
            <select data-cy="date-select" id="date-select"></select>
            <button data-cy="continue-to-time" type="button" hidden>Continuar a horarios</button>
            <button data-cy="back-to-event" type="button">Volver al evento</button>
        </section>

        <section id="step-time" hidden>
            <label for="timeslot-select">Horario disponible:</label>
            <select data-cy="timeslot-select" id="timeslot-select"></select>
            <button data-cy="continue-to-details" type="button" hidden>Continuar a los datos</button>
            <button data-cy="back-to-date" type="button">Volver a la fecha</button>
        </section>

        <div data-cy="booking-summary" class="summary-box" hidden>
            <h3>Resumen del Turno</h3>
            <p>Evento: <span id="summary-service"></span></p>
            <p>Fecha: <span id="summary-date"></span></p>
            <p>Hora: <span id="summary-time"></span></p>
        </div>

        <form data-cy="booking-form" id="booking-form" hidden>
            <label for="name">Nombre Completo:</label>
            <input data-cy="name-input" type="text" id="name" placeholder="Ej: Juan Pérez">
            <label for="email">Correo Electrónico:</label>
            <input data-cy="email-input" type="email" id="email" placeholder="invitado@test.com">
            <button data-cy="submit-booking" type="submit">Confirmar reserva</button>
            <button data-cy="back-to-time" type="button">Volver al horario</button>
            <div data-cy="error-message" class="error" hidden></div>
            <div data-cy="time-unavailable-error" class="error" hidden>
                El horario seleccionado ya no está disponible.
            </div>
            <button data-cy="choose-another-time" type="button" hidden>Elegir otro horario</button>
        </form>

        <div data-cy="booking-confirmation" class="pending-box" hidden></div>

        <hr>
        <h3>Bandeja de Notificaciones (Simulación M06)</h3>
        <div data-cy="notifications-log" id="notifications-log">
            <em>No hay notificaciones enviadas aún.</em>
        </div>
    </div>
    <script src="../src/proceso_reserva.js"></script>
</body>
</html>
